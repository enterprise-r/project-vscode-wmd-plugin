name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.3.2"
        required: true

permissions:
  contents: read

concurrency:
  group: release

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # Run workflow: commit "Release X.Y.Z" on main and tag vX.Y.Z.
  # The commit goes through the GitHub API, so GitHub signs it (Verified).
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bump version, changelog, commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Version must look like 1.2.3, got $VERSION"; exit 1; }
          [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$VERSION" ] && [ "$current" != "$VERSION" ] \
            || { echo "::error::$VERSION is not newer than $current"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null \
            && { echo "::error::Tag $TAG already exists"; exit 1; } || true

          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          # Date the Unreleased section as this version and leave a fresh one.
          node <<'EOF'
          const fs = require("fs");
          const version = process.env.VERSION;
          const date = new Date().toISOString().slice(0, 10);
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          if (lines[0] !== "# Changelog") {
            console.error("::error::CHANGELOG.md must start with # Changelog");
            process.exit(1);
          }
          const start = lines.findIndex((line) => line.trim() === "## Unreleased");
          if (start < 0) {
            console.error("::error::CHANGELOG.md has no ## Unreleased section");
            process.exit(1);
          }
          let end = lines.findIndex((line, i) => i > start && line.startsWith("## "));
          if (end < 0) end = lines.length;
          const notes = lines.slice(start + 1, end).join("\n").trim();
          if (!notes) {
            console.error("::error::## Unreleased has no changes to release");
            process.exit(1);
          }
          const kept = lines.slice(0, start).concat(lines.slice(end));
          const afterTitle = kept.slice(1).join("\n").replace(/^\n+/, "").replace(/\n+$/, "");
          const out = [
            "# Changelog",
            "",
            "## Unreleased",
            "",
            `## ${version} - ${date}`,
            "",
            notes,
            "",
            afterTitle,
            "",
          ].join("\n");
          fs.writeFileSync("CHANGELOG.md", out);
          EOF
          git diff --stat

          b64() { base64 -w0 "$1"; }
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" --arg head "$(git rev-parse HEAD)" \
            --arg msg "Release $VERSION" \
            --arg pkg "$(b64 package.json)" --arg log "$(b64 CHANGELOG.md)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head, message: {headline: $msg},
                fileChanges: {additions: [{path: "package.json", contents: $pkg},
                                          {path: "CHANGELOG.md", contents: $log}]}}}}' > commit.json
          sha=$(gh api graphql --input commit.json \
            --jq '.data.createCommitOnBranch.commit.oid')
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" >/dev/null
          echo "Committed $sha and tagged $TAG" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npx --yes @vscode/vsce@4 package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the CHANGELOG section "## X.Y.Z ..." up to the next "## ".
          awk -v v="${TAG#v}" '
            /^## / { on = ($2 == v); next }
            on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" *.vsix --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" *.vsix --title "$TAG" --generate-notes
          fi

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Publish to the VS Code Marketplace (Trusted Publishing)
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath *.vsix
